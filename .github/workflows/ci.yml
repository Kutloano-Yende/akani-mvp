name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next generates some global types (e.g. LayoutProps); a fresh checkout needs them before tsc.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Dummy values: the build needs the variables to exist but never
      # contacts Supabase, so CI needs no secrets.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
